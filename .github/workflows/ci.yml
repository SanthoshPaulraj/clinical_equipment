name: Continuous Integration & Empirical Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Dataset & Seed SQLite Database
        run: |
          python scripts/generate_dataset.py
          python scripts/seed_database.py

      - name: Execute Full Pytest Test Suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run Independent Clinical Disruption Evaluation
        run: |
          python scripts/run_evaluation.py
